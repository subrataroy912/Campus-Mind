<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/logo-square.webp"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link
      rel="preload"
      as="image"
      href="/logo-square.webp"
      fetchpriority="high"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Mind</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("campus-mind.theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (!saved || saved === "system") && prefersDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --canvas: oklch(0.99 0.002 260);
        --surface: oklch(1 0 0);
        --border: oklch(0.915 0.005 260);
        --primary: oklch(0.55 0.22 265);
      }
      .dark {
        --canvas: oklch(0.12 0.01 260);
        --surface: oklch(0.16 0.01 260);
        --border: oklch(1 0 0 / 10%);
        --primary: oklch(0.62 0.21 265);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--canvas);
        color: inherit;
        font-family: "Geist Variable", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      /* Hide scrollbar for Chrome, Safari, and Opera */
      &::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge, and Firefox */
      -ms-overflow-style: none; /* IE and Edge */
      scrollbar-width: none; /* Firefox */
      #root {
        min-height: 100dvh;
        background-color: var(--canvas);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
